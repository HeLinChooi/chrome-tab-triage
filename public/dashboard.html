<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tab Triage</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="wrap viz-root">
    <header class="page-head">
      <div>
        <h1>Tab Triage</h1>
        <div id="generated" class="muted tiny">—</div>
      </div>
      <div class="action-row">
        <button id="analyze" class="primary">Re-analyze</button>
        <button id="options">Settings</button>
      </div>
    </header>

    <div id="warnings"></div>

    <section class="hero card">
      <div class="hero-figure">
        <div id="heroTotal" class="value">—</div>
        <div class="label">of focused work sitting in open tabs</div>
      </div>
      <dl id="heroStats" class="hero-stats"></dl>
    </section>

    <section id="budget" class="budget card">
      <div class="section-head">
        <h2>Where the time is</h2>
        <span class="muted tiny">Every segment is a share of the total above</span>
      </div>
      <div id="budgetBar" class="budget-bar"></div>
      <ul id="budgetLegend" class="legend"></ul>
    </section>

    <section id="quickWins" class="quickwins card" hidden></section>

    <section class="ledger">
      <div class="section-head">
        <h2>Every tab</h2>
        <div id="groupBy" class="segmented">
          <button data-group="site" class="active">By site</button>
          <button data-group="task">By task</button>
        </div>
      </div>
      <div id="ledgerBody"></div>
    </section>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
